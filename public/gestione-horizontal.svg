<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 520" width="1760" height="520" role="img" aria-labelledby="horizTitle" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="horizTitle">GestiOne — Vente et Gestion (logo horizontal)</title>
  <defs>
    <!-- ================= DÉGRADÉS (modifiable) ================= -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#063B73"/>
      <stop offset="55%" stop-color="#061B45"/>
      <stop offset="100%" stop-color="#061B45"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="15%" cy="10%" r="75%">
      <stop offset="0%"  stop-color="#00D9A5" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#00B8D9" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00B8D9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="awningOrange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF8A00"/>
      <stop offset="100%" stop-color="#FF6B00"/>
    </linearGradient>
    <linearGradient id="awningWhite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8ECF5"/>
    </linearGradient>
    <linearGradient id="facadeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD21F"/>
      <stop offset="100%" stop-color="#FF6B00"/>
    </linearGradient>
    <linearGradient id="windowGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00B8D9"/>
      <stop offset="100%" stop-color="#063B73"/>
    </linearGradient>
    <linearGradient id="gearGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD21F"/>
      <stop offset="100%" stop-color="#FF6B00"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#FFD21F"/>
    </linearGradient>
    <linearGradient id="oneGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD21F"/>
      <stop offset="100%" stop-color="#FF6B00"/>
    </linearGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#061B45" flood-opacity="0.45"/>
    </filter>
    <filter id="smallShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#061B45" flood-opacity="0.35"/>
    </filter>

    <clipPath id="horizClip"><rect x="0" y="0" width="1760" height="520" rx="56"/></clipPath>
  </defs>
  <g clip-path="url(#horizClip)">
    <g id="background">
      <rect x="0" y="0" width="1760" height="520" fill="url(#bgGrad)"/>
      <rect x="0" y="0" width="1760" height="520" fill="url(#glowGrad)"/>
    </g>
    <g transform="translate(-10 51) scale(0.62)">
      
  <g id="brandMarkHoriz">
    <!-- ===== g#store : boutique (auvent, façade, vitrine, porte) ===== -->
    <g id="store" filter="url(#softShadow)">
      <!-- bandeau haut de l'auvent -->
      <rect x="80" y="86" width="480" height="44" rx="16" fill="url(#awningOrange)"/>
      <!-- lambrequin rayé (rayures orange / blanc, bas arrondi façon store banne) -->
      <g id="awning-stripes">
        <path d="M80,130 h68 v78 q0,26 -34,26 q-34,0 -34,-26 Z" fill="url(#awningOrange)"/>
        <path d="M148,130 h68 v88 q0,24 -34,24 q-34,0 -34,-24 Z" fill="url(#awningWhite)"/>
        <path d="M216,130 h68 v96 q0,22 -34,22 q-34,0 -34,-22 Z" fill="url(#awningOrange)"/>
        <path d="M284,130 h68 v96 q0,22 -34,22 q-34,0 -34,-22 Z" fill="url(#awningWhite)"/>
        <path d="M352,130 h68 v88 q0,24 -34,24 q-34,0 -34,-24 Z" fill="url(#awningOrange)"/>
        <path d="M420,130 h68 v78 q0,26 -34,26 q-34,0 -34,-26 Z" fill="url(#awningWhite)"/>
        <path d="M488,130 h72 v70 q0,26 -36,26 q-36,0 -36,-26 Z" fill="url(#awningOrange)"/>
      </g>
      <!-- façade -->
      <rect x="108" y="230" width="420" height="280" rx="18" fill="url(#facadeGrad)"/>
      <rect x="108" y="230" width="420" height="280" rx="18" fill="none" stroke="#061B45" stroke-opacity="0.15" stroke-width="4"/>
      <!-- vitrine bleue avec panier -->
      <rect x="158" y="278" width="190" height="176" rx="14" fill="url(#windowGrad)"/>
      <rect x="158" y="278" width="190" height="176" rx="14" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="4"/>
      <g id="basket" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M223,352 q30,-46 60,0" />
        <path d="M203,352 h160 l-16,78 q-3,14 -18,14 h-92 q-15,0 -18,-14 Z" fill="#FFFFFF" stroke="none"/>
        <path d="M228,366 v56 M253,366 v62 M278,366 v56" stroke="#00B8D9" stroke-width="8"/>
      </g>
      <!-- porte -->
      <rect x="392" y="322" width="112" height="188" rx="10" fill="#061B45"/>
      <circle cx="472" cy="416" r="7" fill="#FFD21F"/>
    </g>

    <!-- ===== g#growth : graphique en barres + flèche ascendante ===== -->
    <g id="growth">
      <rect x="540" y="368" width="34" height="92" rx="6" fill="url(#barGrad)"/>
      <rect x="584" y="330" width="34" height="130" rx="6" fill="url(#barGrad)"/>
      <rect x="628" y="286" width="34" height="174" rx="6" fill="url(#barGrad)"/>
      <path d="M556,272 L650,178 M650,178 h-46 M650,178 v46" fill="none" stroke="#FFD21F" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- ===== g#management : engrenage (gestion) ===== -->
    <g id="management" filter="url(#smallShadow)">
      <g fill="url(#gearGrad)">
        <rect x="-15.0" y="-108.0" width="30.0" height="34.0" rx="6" transform="translate(560 480) rotate(0.0)"/>
      <rect x="-15.0" y="-108.0" width="30.0" height="34.0" rx="6" transform="translate(560 480) rotate(36.0)"/>
      <rect x="-15.0" y="-108.0" width="30.0" height="34.0" rx="6" transform="translate(560 480) rotate(72.0)"/>
      <rect x="-15.0" y="-108.0" width="30.0" height="34.0" rx="6" transform="translate(560 480) rotate(108.0)"/>
      <rect x="-15.0" y="-108.0" width="30.0" height="34.0" rx="6" transform="translate(560 480) rotate(144.0)"/>
      <rect x="-15.0" y="-108.0" width="30.0" height="34.0" rx="6" transform="translate(560 480) rotate(180.0)"/>
      <rect x="-15.0" y="-108.0" width="30.0" height="34.0" rx="6" transform="translate(560 480) rotate(216.0)"/>
      <rect x="-15.0" y="-108.0" width="30.0" height="34.0" rx="6" transform="translate(560 480) rotate(252.0)"/>
      <rect x="-15.0" y="-108.0" width="30.0" height="34.0" rx="6" transform="translate(560 480) rotate(288.0)"/>
      <rect x="-15.0" y="-108.0" width="30.0" height="34.0" rx="6" transform="translate(560 480) rotate(324.0)"/>
        <circle cx="560" cy="480" r="88" />
      </g>
      <circle cx="560" cy="480" r="88" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="4"/>
      <circle cx="560" cy="480" r="34" fill="#061B45"/>
    </g>
  </g>

    </g>
  </g>
  
  <g id="brand" transform="translate(560 210) scale(0.72)" text-anchor="start">
    <text x="0" y="0" font-family="'Poppins','Montserrat',-apple-system,'Segoe UI',sans-serif" font-weight="800" font-size="180" letter-spacing="-2">
      <tspan fill="#FFFFFF">Gesti</tspan><tspan fill="url(#oneGrad)">One</tspan>
    </text>
    <g id="subtitle" transform="translate(0 60)">
      <rect x="0" y="0" width="660" height="86" rx="43" fill="#FFD21F"/>
      <circle cx="73" cy="43" r="30" fill="#061B45"/>
      <g transform="translate(73 43)" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-15,-7 Q0,-24 15,-7"/>
        <path d="M-17,-7 H17 L12,13 Q11,17 7,17 H-7 Q-11,17 -12,13 Z" fill="#FFFFFF" stroke="none"/>
        <path d="M-8,-1 V11 M0,-1 V13 M8,-1 V11" stroke="#00B8D9" stroke-width="3.5"/>
      </g>
      <text x="138" y="56" font-family="'Poppins','Montserrat',-apple-system,'Segoe UI',sans-serif" font-weight="700" font-size="46" fill="#061B45" text-anchor="start">Vente &amp; Gestion</text>
    </g>
  </g>

</svg>
